<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PawsitiveBD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🐾 PawsitiveBD</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cases.html">Rescue Cases</a></li>
        <li><a href="adopt.html">Adopt</a></li>
        <li><a href="report.html">Report Animal</a></li>
        <li><a href="login.html" class="btn-login active">Login</a></li>
      </ul>
    </div>
  </header>

  <!-- Login Form Container -->
  <div class="container" style="max-width: 450px;">
    <h2 class="section-title">Welcome Back</h2>
    <p style="text-align: center; color: #666; margin-bottom: 2rem;">Log in to track your rescue reports or manage listings.</p>
    
    <form style="background: #ffffff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      
      <!-- Email -->
      <div style="margin-bottom: 1.5rem;">
        <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>

      <!-- Password -->
      <div style="margin-bottom: 1.5rem;">
        <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Password</label>
        <input type="password" id="password" placeholder="********" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; font-size: 1rem; margin-bottom: 1rem;">Log In</button>
      
      <p style="text-align: center; font-size: 0.9rem; color: #666;">
        Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a>
      </p>

    </form>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 PawsitiveBD. Built for community animal rescue in Bangladesh.</p>
  </footer>

</body>
</html>
